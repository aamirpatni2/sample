name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  offline:
    name: Offline suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r requirements-agent.txt

      # No ANTHROPIC_API_KEY is set. Every test here runs against injected
      # fakes, so a suite that suddenly needs the network fails loudly here
      # rather than quietly costing money.
      - name: Run tests
        run: python -m unittest discover -s tests --verbose

      - name: Check for committed secrets
        run: |
          if git grep -nE 'sk-ant-api03-[A-Za-z0-9_-]{40,}' -- . ':!tests/'; then
            echo "::error::A real API key shape was found outside tests/"
            exit 1
          fi
          echo "No credential-shaped strings outside test fixtures."
